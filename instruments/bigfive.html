  <script type="application/json" id="pi-def">{"id":"bigfive","version":"2.0.0","title":"Big Five","source":"IPIP-NEO-120 (Johnson, 2014): 120 items → 30 facets → 10 aspects (DeYoung, Quilty & Peterson, 2007) → 5 domains → 2 metatraits (DeYoung, 2006). Items transcribed verbatim and cross-checked across two public-domain sources; scored against published age/sex norms. See content-sources/bigfive.md.","citation":"Johnson, J. A. (2014). Measuring thirty facets of the Five Factor Model with a 120-item public domain inventory: Development of the IPIP-NEO-120. Journal of Research in Personality, 51, 78–89. · DeYoung, C. G., Quilty, L. C., & Peterson, J. B. (2007). Between facets and domains: 10 aspects of the Big Five. Journal of Personality and Social Psychology, 93, 880–896. · DeYoung, C. G. (2006). Higher-order factors of the Big Five in a multi-informant sample. Journal of Personality and Social Psychology, 91, 1138–1151. · Items: International Personality Item Pool (public domain), ipip.ori.org.","license":"Public Domain (IPIP). https://ipip.ori.org/newPermission.htm","intro":"This is the long one — 120 short statements about how you typically think, feel, and act. It reports four levels at once: 2 metatraits, 5 domains, 10 aspects, and 30 facets, each placed against people under 21 rather than against the midpoint of the scale. It is a map of your raw material, not a verdict or a grade. Answer for how you generally are, not how you wish to be.","sections":[{"type":"info","id":"intro","title":"Before you start","body":"There are no right answers and no good or bad scores — every trait has a light side and a shadow. Results are reported as percentiles against published norms for people under 21: a percentile of 70 means about 70 out of 100 people in that comparison group answered lower. Every score is shown with an uncertainty range, because a four-item facet is a rough measure. The norms are large, adult-leaning, and English-language, and this is one August of DP1, not a fixed identity."},{"type":"info","id":"hierarchy","title":"Four levels, not five scores","body":"Personality research describes the Big Five as a hierarchy, not a flat list. At the top, two metatraits: Stability (the thread through low Neuroticism, high Agreeableness, high Conscientiousness) and Plasticity (the thread through Extraversion and Openness). Below them the five domains. Below each domain, two aspects — the halves a domain splits into when its facets are factor-analysed. At the bottom, thirty facets, four items each. A mid-range domain score almost never means mid-range facets: it usually means high facets and low facets averaging each other out, and the point of reading downward is to find out which."},{"type":"scored-likert","id":"main","anchors":["Very Inaccurate","Moderately Inaccurate","Neither Accurate Nor Inaccurate","Moderately Accurate","Very Accurate"],"band_thresholds":{"mode":"norm-referenced","bands":["very-low","low","slightly-low","mid","slightly-high","high","very-high"],"cuts":[0.1,0.25,0.4,0.6,0.75,0.9],"copy_poles":{"very-low":"low","low":"low","slightly-low":"low","mid":"mid","slightly-high":"high","high":"high","very-high":"high"}},"items":[{"text":"Worry about things","scale":"neuroticism_anxiety","reverse":false,"points":5},{"text":"Make friends easily","scale":"extraversion_friendliness","reverse":false,"points":5},{"text":"Have a vivid imagination","scale":"openness_imagination","reverse":false,"points":5},{"text":"Trust others","scale":"agreeableness_trust","reverse":false,"points":5},{"text":"Complete tasks successfully","scale":"conscientiousness_self-efficacy","reverse":false,"points":5},{"text":"Get angry easily","scale":"neuroticism_anger","reverse":false,"points":5},{"text":"Love large parties","scale":"extraversion_gregariousness","reverse":false,"points":5},{"text":"Believe in the importance of art","scale":"openness_artistic-interests","reverse":false,"points":5},{"text":"Use others for my own ends","scale":"agreeableness_morality","reverse":true,"points":5},{"text":"Like to tidy up","scale":"conscientiousness_orderliness","reverse":false,"points":5},{"text":"Often feel blue","scale":"neuroticism_depression","reverse":false,"points":5},{"text":"Take charge","scale":"extraversion_assertiveness","reverse":false,"points":5},{"text":"Experience my emotions intensely","scale":"openness_emotionality","reverse":false,"points":5},{"text":"Love to help others","scale":"agreeableness_altruism","reverse":false,"points":5},{"text":"Keep my promises","scale":"conscientiousness_dutifulness","reverse":false,"points":5},{"text":"Find it difficult to approach others","scale":"neuroticism_self-consciousness","reverse":false,"points":5},{"text":"Am always busy","scale":"extraversion_activity-level","reverse":false,"points":5},{"text":"Prefer variety to routine","scale":"openness_adventurousness","reverse":false,"points":5},{"text":"Love a good fight","scale":"agreeableness_cooperation","reverse":true,"points":5},{"text":"Work hard","scale":"conscientiousness_achievement-striving","reverse":false,"points":5},{"text":"Go on binges","scale":"neuroticism_immoderation","reverse":false,"points":5},{"text":"Love excitement","scale":"extraversion_excitement-seeking","reverse":false,"points":5},{"text":"Love to read challenging material","scale":"openness_intellect","reverse":false,"points":5},{"text":"Believe that I am better than others","scale":"agreeableness_modesty","reverse":true,"points":5},{"text":"Am always prepared","scale":"conscientiousness_self-discipline","reverse":false,"points":5},{"text":"Panic easily","scale":"neuroticism_vulnerability","reverse":false,"points":5},{"text":"Radiate joy","scale":"extraversion_cheerfulness","reverse":false,"points":5},{"text":"Tend to vote for liberal political candidates","scale":"openness_liberalism","reverse":false,"points":5},{"text":"Sympathize with the homeless","scale":"agreeableness_sympathy","reverse":false,"points":5},{"text":"Jump into things e,"points":5},{"text":"Do more than what's expected of me","scale":"conscientiousness_achievement-striving","reverse":false,"points":5},{"text":"Rarely overindulge","scale":"neuroticism_immoderation","reverse":true,"points":5},{"text":"Seek adventure","scale":"extraversion_excitement-seeking","reverse":false,"points":5},{"text":"Avoid philosophical discussions","scale":"openness_intellect","reverse":true,"points":5},{"text":"Think highly of myself","scale":"agreeableness_modesty","reverse":true,"points":5},{"text":"Carry out my plans","scale":"conscientiousness_self-discipline","reverse":false,"points":5},{"text":"Become overwhelmed by events","scale":"neuroticism_vulnerability","reverse":false,"points":5},{"text":"Have a lot of fun","scale":"extraversion_cheerfulness","reverse":false,"points":5},{"text":"Believe that there is no absolute right and wrong","scale":"openness_liberalism","reverse":false,"points":5},{"text":"Feel sympathy for those who are worse off than myself","scale":"agreeableness_sympathy","reverse":false,"points":5},{"text":"Make rash decisions","scale":"conscientiousness_cautiousness","reverse":true,"points":5},{"text":"Am afraid of many things","scale":"neuroticism_anxiety","reverse":false,"points":5},{"text":"Avoid contacts with others","scale":"extraversion_friendliness","reverse":true,"points":5},{"text":"Love to daydream","scale":"openness_imagination","reverse":false,"points":5},{"text":"Trust what people say","scale":"agreeableness_trust","reverse":false,"points":5},{"text":"Handle tasks smoothly","scale":"conscientiousness_self-efficacy","reverse":false,"points":5},{"text":"Lose my temper","scale":"neuroticism_anger","reverse":false,"points":5},{"text":"Prefer to be alone","scale":"extraversion_gregariousness","reverse":true,"points":5},{"text":"Do not like poetry","scale":"openness_artistic-interests","reverse":true,"points":5},{"text":"Take advantage of others","scale":"agreeableness_morality","reverse":true,"points":5},{"text":"Leave a mess in my room","scale":"conscientiousness_orderliness","reverse":true,"points":5},{"text":"Am often down in the dumps","scale":"neuroticism_depression","reverse":false,"points":5},{"text":"Take control of things","scale":"extraversion_assertiveness","reverse":false,"points":5},{"text":"Rarely notice my emotional reactions","scale":"openness_emotionality","reverse":true,"points":5},{"text":"Am indifferent to the feelings of others","scale":"agreeableness_altruism","reverse":true,"points":5},{"text":"Break rules","scale":"conscientiousness_dutifulness","reverse":true,"points":5},{"text":"Only feel comfortable with friends","scale":"neuroticism_self-consciousness","reverse":false,"points":5},{"text":"Do a lot in my spare time","scale":"extraversion_activity-level","reverse":false,"points":5},{"text":"Dislike changes","scale":"openness_adventurousness","reverse":true,"points":5},{"text":"Insult people","scale":"agreeableness_cooperation","reverse":true,"points":5},{"text":"Do just enough work to get by","scale":"conscientiousness_achievement-striving","reverse":true,"points":5},{"text":"Easily resist temptations","scale":"neuroticism_immoderation","reverse":true,"points":5},{"text":"Enjoy being reckless","scale":"extraversion_excitement-seeking","reverse":false,"points":5},{"text":"Have difficulty understanding abstract ideas","scale":"openness_intellect","reverse":true,"points":5},{"text":"Have a high opinion of myself","scale":"agreeableness_modesty","reverse":true,"points":5},{"text":"Waste my time","scale":"conscientiousness_self-discipline","reverse":true,"points":5},{"text":"Feel that I'm unable to deal with things","scale":"neuroticism_vulnerability","reverse":false,"points":5},{"text":"Love life","scale":"extraversion_cheerfulness","reverse":false,"points":5},{"text":"Tend to vote for conservative political candidates","scale":"openness_liberalism","reverse":true,"points":5},{"text":"Am not interested in other people's problems","scale":"agreeableness_sympathy","reverse":true,"points":5},{"text":"Rush into things","scale":"conscientiousness_cautiousness","reverse":true,"points":5},{"text":"Get stressed out easily","scale":"neuroticism_anxiety","reverse":false,"points":5},{"text":"Keep others at a distance","scale":"extraversion_friendliness","reverse":true,"points":5},{"text":"Like to get lost in thought","scale":"openness_imagination","reverse":false,"points":5},{"text":"Distrust people","scale":"agreeableness_trust","reverse":true,"points":5},{"text":"Know how to get things done","scale":"conscientiousness_self-efficacy","reverse":false,"points":5},{"text":"Am not easily annoyed","scale":"neuroticism_anger","reverse":true,"points":5},{"text":"Avoid crowds","scale":"extraversion_gregariousness","reverse":true,"points":5},{"text":"Do not enjoy going to art museums","scale":"openness_artistic-interests","reverse":true,"points":5},{"text":"Obstruct others' plans","scale":"agreeableness_morality","reverse":true,"points":5},{"text":"Leave my belongings around","scale":"conscientiousness_orderliness","reverse":true,"points":5},{"text":"Feel comfortable with myself","scale":"neuroticism_depression","reverse":true,"points":5},{"text":"Wait for others to lead the way","scale":"extraversion_assertiveness","reverse":true,"points":5},{"text":"Don't understand people who get emotional","scale":"openness_emotionality","reverse":true,"points":5},{"text":"Take no time for others","scale":"agreeableness_altruism","reverse":true,"points":5},{"text":"Break my promises","scale":"conscientiousness_dutifulness","reverse":true,"points":5},{"text":"Am not bothered by difficult social situations","scale":"neuroticism_self-consciousness","reverse":true,"points":5},{"text":"Like to take it easy","scale":"extraversion_activity-level","reverse":true,"points":5},{"text":"Am attached to conventional ways","scale":"openness_adventurousness","reverse":true,"points":5},{"text":"Get back at others","scale":"agreeableness_cooperation","reverse":true,"points":5},{"text":"Put little time and effort into my work","scale":"conscientiousness_achievement-striving","reverse":true,"points":5},{"text":"Am able to control my cravings","scale":"neuroticism_immoderation","reverse":true,"points":5},{"text":"Act wild and crazy","scale":"extraversion_excitement-seeking","reverse":false,"points":5},{"text":"Am not interested in theoretical discussions","scale":"openness_intellect","reverse":true,"points":5},{"text":"Boast about my virtues","scale":"agreeableness_modesty","reverse":true,"points":5},{"text":"Have difficulty starting tasks","scale":"conscientiousness_self-discipline","reverse":true,"points":5},{"text":"Remain calm under pressure","scale":"neuroticism_vulnerability","reverse":true,"points":5},{"text":"Look at the bright side of life","scale":"extraversion_cheerfulness","reverse":false,"points":5},{"text":"Believe that we should be tough on crime","scale":"openness_liberalism","reverse":true,"points":5},{"text":"Try not to think about the needy","scale":"agreeableness_sympathy","reverse":true,"points":5},{"text":"Act without thinking","scale":"conscientiousness_cautiousness","reverse":true,"points":5}],"scales":[{"id":"meta_stability","name":"Stability","level":"metatrait","members":[{"scale":"neuroticism","sign":-1},{"scale":"agreeableness","sign":1},{"scale":"conscientiousness","sign":1}],"construct_explainer":"Stability is the thread shared by low Neuroticism, high Agreeableness, and high Conscientiousness. Researchers describe it as how consistently goals, moods, and social commitments are maintained against disruption. It sits at the top of the trait hierarchy, above the five domains.","spectrum":{"low_end":"Loose, reactive, easily redirected","high_end":"Steady, consistent, hard to knock off course"},"bands":{"low":{"light":"A lower lean often goes with flexibility, spontaneity, and a willingness to let plans break.","shadow":"Moods, commitments, and intentions can shift faster than the people around expect.","one_thing_to_try":"Pick one commitment this week and hold it exactly as agreed, even after the mood passes."},"mid":{"light":"A middle lean holds most things steady while still bending when it matters.","shadow":"Which of those two shows up can depend heavily on the week.","one_thing_to_try":"Notice which ingredient — calm, cooperation, or follow-through — is carrying the others."},"high":{"light":"A higher lean often goes with reliable follow-through, even temper, and easy cooperation.","shadow":"Consistency can harden into rigidity when a situation actually calls for change.","one_thing_to_try":"Find one routine running on autopilot and ask whether it still earns its place."}},"reliability":0.865},{"id":"meta_plasticity","name":"Plasticity","level":"metatrait","members":[{"scale":"extraversion","sign":1},{"scale":"openness","sign":1}],"construct_explainer":"Plasticity is the thread shared by Extraversion and Openness. Researchers describe it as the pull toward exploration — engaging with new people, ideas, and possibilities rather than with what is already known. It sits alongside Stability at the top of the hierarchy.","spectrum":{"low_end":"Settled, familiar, inward","high_end":"Exploratory, outward, novelty-seeking"},"bands":{"low":{"light":"A lower lean often goes with depth, focus, and comfort in the familiar.","shadow":"New rooms, new ideas, and new people can be passed over before they are tested.","one_thing_to_try":"Say yes to one unfamiliar thing this week that would normally get a no."},"mid":{"light":"A middle lean explores when there is a reason and settles when there is not.","shadow":"The pull to explore can go wherever the surrounding group happens to point.","one_thing_to_try":"Choose one thing to explore on purpose rather than by circumstance."},"high":{"light":"A higher lean often goes with curiosity, energy in new situations, and quick engagement.","shadow":"The next new thing can pull attention off the thing already started.","one_thing_to_try":"Finish one started thing before opening the next."}},"reliability":0.897},{"id":"neuroticism","name":"Neuroticism","construct_explainer":"Neuroticism reflects a tendency toward negative emotions like worry, irritation, and low mood, and how strongly stress is felt. It is not weakness — it tracks how sensitively a person registers threat and setback.","bands":{"low":{"light":"Answers leaning lower often go with staying steady and unbothered under stress.","shadow":"A very low lean can miss real warning signals that discomfort usually flags.","one_thing_to_try":"Notice one situation where a little unease would actually be useful."},"mid":{"light":"A middle lean tends to feel stress without being ruled by it.","shadow":"It can swing toward the rough end on a hard week.","one_thing_to_try":"Spot the earliest sign that stress is building, and name it."},"high":{"light":"Answers leaning higher often go with feeling things deeply and noticing problems early.","shadow":"Strong negative emotion can outrun the facts and wear a person down.","one_thing_to_try":"When upset, check whether the feeling matches the size of the trigger."}},"level":"domain","spectrum":{"low_end":"Calm, hard to rattle","high_end":"Reactive, feels stress strongly"},"members":[{"scale":"neuroticism_anxiety","sign":1},{"scale":"neuroticism_anger","sign":1},{"scale":"neuroticism_depression","sign":1},{"scale":"neuroticism_self-consciousness","sign":1},{"scale":"neuroticism_immoderation","sign":1},{"scale":"neuroticism_vulnerability","sign":1}],"reliability":0.9},{"id":"aspect_volatility","name":"Volatility","parent":"neuroticism","level":"aspect","members":[{"scale":"neuroticism_anger","sign":1},{"scale":"neuroticism_immoderation","sign":1}],"marker_loadings":{"neuroticism_anger":0.76,"neuroticism_immoderation":0.59},"construct_explainer":"Volatility is one of the two aspects of Neuroticism identified by DeYoung and colleagues: negative emotion that turns outward — irritability, temper, and difficulty holding an impulse. It is separable from Withdrawal, which turns inward.","spectrum":{"low_end":"Even-tempered, hard to provoke","high_end":"Quick to flare, hard to rein in"},"bands":{"low":{"light":"A lower lean often goes with a long fuse and steady handling of provocation.","shadow":"Irritation that is never voiced can go unnoticed until it has built up.","one_thing_to_try":"Name one thing that annoyed you this week, out loud, early."},"mid":{"light":"A middle lean flares occasionally and then settles again.","shadow":"How quickly it settles can depend on sleep, workload, and who is in the room.","one_thing_to_try":"Track which conditions make the fuse shorter than usual."},"high":{"light":"A higher lean often goes with strong, fast reactions that make a problem visible immediately.","shadow":"The reaction can arrive before the judgement, and cost more than the trigger was worth.","one_thing_to_try":"Put a deliberate ten-second gap between the feeling and the response."}},"reliability":0.772},{"id":"aspect_withdrawal","name":"Withdrawal","parent":"neuroticism","level":"aspect","members":[{"scale":"neuroticism_depression","sign":1},{"scale":"neuroticism_vulnerability","sign":1},{"scale":"neuroticism_anxiety","sign":1},{"scale":"neuroticism_self-consciousness","sign":1}],"marker_loadings":{"neuroticism_depression":0.85,"neuroticism_vulnerability":0.78,"neuroticism_anxiety":0.78,"neuroticism_self-consciousness":0.76},"construct_explainer":"Withdrawal is the second aspect of Neuroticism: negative emotion that turns inward — anxiety, low mood, self-consciousness, and feeling overwhelmed. Research links Withdrawal and Volatility to different kinds of difficulty, which is why splitting them is useful.","spectrum":{"low_end":"Unruffled, forward-leaning","high_end":"Anticipates threat, pulls back"},"bands":{"low":{"light":"A lower lean often goes with entering situations without much anticipatory dread.","shadow":"Real risks and real costs can be walked into unprepared.","one_thing_to_try":"Before one commitment this week, ask what could genuinely go wrong."},"mid":{"light":"A middle lean hesitates sometimes and pushes forward other times.","shadow":"Which one wins can be settled by mood rather than by the actual stakes.","one_thing_to_try":"Notice one moment where hesitation was information and one where it was noise."},"high":{"light":"A higher lean often goes with early sensitivity to what could go wrong and to how things land with others.","shadow":"Anticipated difficulty can quietly shrink the range of things that get attempted.","one_thing_to_try":"Do one small thing that anticipation says to avoid, and record what actually happened."}},"reliability":0.852},{"id":"neuroticism_anxiety","name":"Anxiety","parent":"neuroticism","construct_explainer":"Anxiety reflects a tendency to feel worried, tense, or on edge about what might go wrong.","bands":{"low":{"light":"Tends to stay calm and unworried in uncertainty.","shadow":"May underestimate real risks worth preparing for.","one_thing_to_try":"Name one risk that deserves a second look."},"mid":{"light":"Reads threat about right most of the time.","shadow":"Can tip into worry on a heavy day.","one_thing_to_try":"Notice which situations spin up the most worry."},"high":{"light":"Alert early to what could go wrong.","shadow":"Worry can outrun the facts and tire the mind.","one_thing_to_try":"Ask whether the worry matches the actual odds."}},"level":"facet","spectrum":{"low_end":"Untroubled by what-ifs","high_end":"Alert to what could go wrong"},"reliability":0.69},{"id":"neuroticism_anger","name":"Anger","parent":"neuroticism","construct_explainer":"Anger reflects how readily someone feels frustration or irritation when things go against them.","bands":{"low":{"light":"Slow to irritate; hard to provoke.","shadow":"May swallow frustration that should be voiced.","one_thing_to_try":"Name one annoyance instead of letting it pass."},"mid":{"light":"Feels irritation but usually keeps it in proportion.","shadow":"Can flare under pressure.","one_thing_to_try":"Catch the early heat before it speaks for you."},"high":{"light":"Quick to register when something is unfair.","shadow":"Irritation can flare faster than it fades.","one_thing_to_try":"Put one beat between the spark and the reply."}},"level":"facet","spectrum":{"low_end":"Slow to irritate","high_end":"Quick to anger"},"reliability":0.69},{"id":"neuroticism_depression","name":"Depression","parent":"neuroticism","construct_explainer":"Depression (as a facet) reflects a tendency toward low mood, discouragement, and feeling down.","bands":{"low":{"light":"Mood tends to stay buoyant and steady.","shadow":"May overlook when something genuinely needs grieving.","one_thing_to_try":"Let one disappointment be felt rather than skipped."},"mid":{"light":"Has low patches but generally recovers.","shadow":"Can dip further under a run of setbacks.","one_thing_to_try":"Notice the first sign mood is sliding."},"high":{"light":"Feels setbacks and loss deeply and honestly.","shadow":"Low mood can settle in and dim motivation.","one_thing_to_try":"Pair one hard feeling with one small action."}},"level":"facet","spectrum":{"low_end":"Steady mood","high_end":"Frequent low mood"},"reliability":0.69},{"id":"neuroticism_self-consciousness","name":"Self-Consciousness","parent":"neuroticism","construct_explainer":"Self-Consciousness reflects sensitivity to others’ judgement and discomfort in social or evaluative situations.","bands":{"low":{"light":"Comfortable being seen and judged.","shadow":"May miss how actions land on others.","one_thing_to_try":"Ask once how something came across."},"mid":{"light":"Feels some social nerves but functions through them.","shadow":"Can shrink in high-stakes attention.","one_thing_to_try":"Do one slightly exposing thing on purpose."},"high":{"light":"Tuned in to how things look to others.","shadow":"Fear of judgement can hold back action.","one_thing_to_try":"Act on one thing despite the worry about looking foolish."}},"level":"facet","spectrum":{"low_end":"At ease being noticed","high_end":"Uneasy under attention"},"reliability":0.69},{"id":"neuroticism_immoderation","name":"Immoderation","parent":"neuroticism","construct_explainer":"Immoderation reflects difficulty resisting urges and cravings — acting on impulse rather than restraint.","bands":{"low":{"light":"Strong restraint with urges and temptations.","shadow":"Restraint can tip into denying real wants.","one_thing_to_try":"Allow one small pleasure on purpose."},"mid":{"light":"Usually resists, sometimes gives in.","shadow":"Can slip when tired or stressed.","one_thing_to_try":"Spot the cue that usually precedes a slip."},"high":{"light":"Comfortable following an impulse and enjoying the moment.","shadow":"Hard-to-resist urges can crowd out longer goals.","one_thing_to_try":"Put one small barrier between urge and action."}},"level":"facet","spectrum":{"low_end":"Resists temptation easily","high_end":"Gives in to cravings"},"reliability":0.69},{"id":"neuroticism_vulnerability","name":"Vulnerability","parent":"neuroticism","construct_explainer":"Vulnerability reflects how easily someone feels overwhelmed or panicked under pressure.","bands":{"low":{"light":"Stays composed when the pressure spikes.","shadow":"May press on past a point where help is wiser.","one_thing_to_try":"Ask for input on one thing before it gets heavy."},"mid":{"light":"Handles most pressure, wobbles under a lot.","shadow":"Can freeze when several things hit at once.","one_thing_to_try":"Pre-plan the first step for a high-pressure moment."},"high":{"light":"Feels the weight of pressure honestly and early.","shadow":"Stress can tip into feeling swamped.","one_thing_to_try":"Break one looming task into its smallest first move."}},"level":"facet","spectrum":{"low_end":"Steady under pressure","high_end":"Overwhelmed under pressure"},"reliability":0.69},{"id":"extraversion","name":"Extraversion","construct_explainer":"Extraversion reflects how much someone is energised by people, activity, and stimulation, and how outwardly warm and assertive they tend to be.","bands":{"low":{"light":"A lower lean often goes with comfort in solitude and depth in one-to-one settings.","shadow":"It can be read as distance, and big rooms can drain energy fast.","one_thing_to_try":"Pick one social setting that is genuinely worth the energy this week."},"mid":{"light":"A middle lean moves between company and quiet fairly easily.","shadow":"It can default to whichever the people around set.","one_thing_to_try":"Choose, on purpose, when to lead the room and when to step back."},"high":{"light":"A higher lean often goes with warmth, energy, and ease in groups.","shadow":"It can crowd out reflection and quieter voices.","one_thing_to_try":"Leave deliberate space for one quieter person to speak."}},"level":"domain","spectrum":{"low_end":"Reserved, recharges alone","high_end":"Outgoing, energised by people"},"members":[{"scale":"extraversion_friendliness","sign":1},{"scale":"extraversion_gregariousness","sign":1},{"scale":"extraversion_assertiveness","sign":1},{"scale":"extraversion_activity-level","sign":1},{"scale":"extraversion_excitement-seeking","sign":1},{"scale":"extraversion_cheerfulness","sign":1}],"reliability":0.89},{"id":"aspect_enthusiasm","name":"Enthusiasm","parent":"extraversion","level":"aspect","members":[{"scale":"extraversion_friendliness","sign":1},{"scale":"extraversion_gregariousness","sign":1},{"scale":"extraversion_cheerfulness","sign":1}],"marker_loadings":{"extraversion_friendliness":0.79,"extraversion_gregariousness":0.71,"extraversion_cheerfulness":0.67},"construct_explainer":"Enthusiasm is the warm, sociable aspect of Extraversion — outgoing friendliness, enjoyment of company, and positive emotion. In DeYoung’s model it is distinct from Assertiveness, which is about drive rather than warmth.","spectrum":{"low_end":"Reserved, self-contained","high_end":"Warm, outgoing, high-spirited"},"band

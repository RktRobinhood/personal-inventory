er time. This is a snapshot of a current belief, not a permanent label. (Higher = more disagreement with the fixed statements = a more growth-leaning view.)","bands":{"fixed-lean":{"light":"A lean toward 'ability is fairly fixed' can come with valuing natural strengths and being realistic about limits.","shadow":"It can also make setbacks feel like proof of a ceiling, which can quietly discourage effort.","one_thing_to_try":"Recall one skill that genuinely improved with practice, and name exactly what the practice was."},"mixed":{"light":"A mix of views tends to treat both effort and natural difference as real.","shadow":"It can swing toward the fixed view under stress or right after a failure.","one_thing_to_try":"Next time something feels hard, add the word 'yet' — as in 'I can't do this yet'."},"growth-lean":{"light":"A lean toward 'ability can grow' often comes with treating difficulty as part of learning rather than a verdict.","shadow":"A strong lean can underplay real constraints, or turn into pressure to always be improving.","one_thing_to_try":"Pick one area where 'good enough for now' is fine, and notice that not everything has to be a growth project."}}}]},{"type":"free-reflection","id":"synthesis","title":"Your turn","prompt":"Where did your thinking sit today, and does that match how you handle hard things? What is one situation where leaning more toward 'this can grow' would help?","placeholder":"In my own words…","is_snapshot":true}]}</script>
